<form class="contact-form" data-endpoint="{{ site.contact_endpoint | escape }}" aria-describedby="contact-status">
  <div class="contact-field">
    <label for="contact-name">Your name</label>
    <input id="contact-name" name="name" autocomplete="name" maxlength="120" required>
  </div>
  <div class="contact-field">
    <label for="contact-handle">Contact method and handle <span>(optional)</span></label>
    <input id="contact-handle" name="contact" autocomplete="off" maxlength="200" aria-describedby="contact-hint">
    <p id="contact-hint">Include an email address or another way to reach you if you’d like a reply.</p>
  </div>
  <div class="contact-field">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="7" maxlength="5000" required></textarea>
  </div>
  <div class="contact-trap" aria-hidden="true">
    <label for="contact-website">Leave this field empty</label>
    <input id="contact-website" name="website" tabindex="-1" autocomplete="off">
  </div>
  <button type="submit" disabled>Send message</button>
  <p id="contact-status" role="status" aria-live="polite">
    {% if site.contact_endpoint == '' %}The contact form is temporarily unavailable.{% else %}Enable JavaScript to send a message.{% endif %}
  </p>
</form>
